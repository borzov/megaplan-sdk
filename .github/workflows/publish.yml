name: Publish to PyPI

# Builds the package on every pushed v* tag, publishes it to PyPI via
# Trusted Publishing (OIDC — no stored token), and attaches the wheel + sdist
# to the matching GitHub Release.
#
# One-time PyPI setup (Trusted Publisher):
#   PyPI → project "megaplan-sdk" → Settings → Publishing → Add a pending/
#   trusted publisher:
#     Owner:        borzov
#     Repository:   megaplan-sdk
#     Workflow:     publish.yml
#     Environment:  pypi
# If you prefer an API token instead, delete the `id-token`/`environment`
# lines from the pypi-publish job and add `with: { password: ${{ secrets.PYPI_API_TOKEN }} }`
# to the pypa/gh-action-pypi-publish step, then store the token as a repo secret.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload release assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload wheel + sdist to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
